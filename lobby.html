<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Rush Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="lobby">
    <div id="app"></div>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const app = document.querySelector('#app');
        if (!app) return;
        if (window.DungeonRushData && typeof window.DungeonRushData === 'object') {
          const { heroCatalog, defaultMockCombatants } = window.DungeonRushData;
          const baseState = {
            screen: 'lobby',
            selectedId: null,
            game: null,
            selectedHeroIds: [],
            selectedMonsterIds: [],
            combatants: [...defaultMockCombatants].sort((a, b) => b.initiative - a.initiative || a.name.localeCompare(b.name)),
          };
          Object.assign(window.state || {}, baseState);
          if (window.render) window.render();
        }
      });
    </script>
  </body>
</html>
